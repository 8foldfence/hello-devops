# RELEASE stage: pushing a tag like v0.2.0 publishes a versioned image,
# then updates the deploy config in Git so Argo CD rolls it out (GitOps).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write    # to commit the new image tag to k8s/
  packages: write    # to push to GitHub Container Registry

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/hello-devops

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: APP_VERSION=${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest

      - name: Point the deployment at the new version (GitOps)
        run: |
          sed -i "s|newTag: .*|newTag: ${{ github.ref_name }}|" k8s/kustomization.yaml
          git config user.name  "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git commit -m "deploy: hello-devops ${{ github.ref_name }}"
          git push origin main

      - name: Create GitHub release with notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} --generate-notes
