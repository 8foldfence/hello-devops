apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-devops
spec:
  replicas: 2
  strategy:
    type: RollingUpdate          # replace pods one at a time -> zero downtime
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: hello-devops
  template:
    metadata:
      labels:
        app: hello-devops
    spec:
      containers:
        - name: web
          image: hello-devops      # kustomize swaps in ghcr.io/...:<tag>
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:          # no traffic until the pod says it's ready
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:           # restart the pod if it stops answering
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 250m, memory: 128Mi }
