# NodePort 30080 is mapped to http://localhost:8080 on your laptop by the kind cluster.
apiVersion: v1
kind: Service
metadata:
  name: hello-devops
  labels:
    app: hello-devops
spec:
  type: NodePort
  selector:
    app: hello-devops
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
