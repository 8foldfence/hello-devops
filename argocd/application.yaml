# DEPLOY stage (GitOps): Argo CD watches k8s/ on main and makes the cluster match it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-devops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/8foldfence/hello-devops.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-devops
  syncPolicy:
    automated:
      prune: true      # delete things removed from Git
      selfHeal: true   # undo manual changes made with kubectl
    syncOptions:
      - CreateNamespace=true
